name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Excludes `dlss`, which requires the proprietary NVIDIA DLSS SDK (LEONIDA_DLSS_SDK).
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --locked --features leonida/diagnostics,leonida/mimalloc,leonida-core/diagnostics,leonida-gpu/diagnostics,leonida-gpu/mimalloc,leonida-hle/diagnostics,leonida-hle/mimalloc,leonida-loader/diagnostics,leonida-shader/diagnostics,leonida-shader/host -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
